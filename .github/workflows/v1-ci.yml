name: V1 CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Java 21 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: java_backend
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Java 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java_backend/pom.xml
      - name: Run backend tests
        run: mvn --batch-mode --no-transfer-progress test

  backend-container-smoke:
    name: PostgreSQL container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: java_backend
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Test backup retention safety
        shell: pwsh
        run: ./scripts/test-backup-retention.ps1
      - name: Build and verify isolated containers
        shell: pwsh
        run: ./scripts/smoke.ps1

  flutter-tests:
    name: Flutter 3.44.6 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile_desktop_app
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Run static analysis
        run: flutter analyze
      - name: Run unit and widget tests
        run: flutter test

  windows-desktop-build:
    name: Windows Desktop debug build
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile_desktop_app
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run Windows native crypto tests
        run: flutter test --no-pub test/modules/device_key_service_test.dart
      - name: Build Windows Desktop debug bundle
        run: flutter build windows --debug --no-pub
      - name: Run Windows secure storage and WebRTC integration
        run: >-
          flutter test --no-pub -d windows
          --dart-define=RUNTIME_PLATFORM=Windows
          integration_test/android_crypto_runtime_test.dart
