name: p2p_chat_app
description: Mobile-first Modular P2P Messenger（手機主端 + 桌面副端）。
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 本機資料庫（Sprint 2）
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0   # 桌面 / 測試環境
  path: ^1.9.0
  path_provider: ^2.1.0
  # 工具
  uuid: ^4.2.0
  intl: ^0.20.2
  flutter_webrtc: ^1.5.2
  sodium: 4.0.3
  flutter_secure_storage: 10.3.1
  crypto: 3.0.7
  qr_flutter: 4.1.0
  mobile_scanner: 6.0.11
  local_auth: 2.3.0
  # 鎖定仍支援本專案 Flutter 3.27 / Dart 3.6 下限的 federated 實作。
  local_auth_android: 1.0.51
  local_auth_darwin: 1.6.0
  local_auth_platform_interface: 1.0.10
  flutter_plugin_android_lifecycle: 2.0.29
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
