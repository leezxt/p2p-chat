server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/p2p_chat}
    username: ${DB_USERNAME:p2p_chat}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

app:
  security:
    local-dev-key: ${LOCAL_DEV_AUTH_KEY}
    push-token:
      encryption-keys: ${PUSH_TOKEN_ENCRYPTION_KEYS:local-v1=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}

logging:
  level:
    root: INFO
    com.p2pchat: DEBUG
