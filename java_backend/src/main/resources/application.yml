spring:
  application:
    name: p2p-chat-backend
  profiles:
    default: prod
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  push:
    delivery:
      enabled: ${PUSH_DELIVERY_ENABLED:false}
      batch-size: ${PUSH_DELIVERY_BATCH_SIZE:50}
      poll-delay: ${PUSH_DELIVERY_POLL_DELAY:PT5S}
    fcm:
      enabled: ${FCM_ENABLED:false}
      project-id: ${FCM_PROJECT_ID:}
  security:
    websocket:
      allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:}
    push-token:
      encryption-keys: ${PUSH_TOKEN_ENCRYPTION_KEYS}
      revoked-retention: ${PUSH_TOKEN_REVOKED_RETENTION:P30D}
      cleanup-delay: ${PUSH_TOKEN_CLEANUP_DELAY:PT1H}
    jwt:
      issuer: p2p-chat-backend
      audience: p2p-chat-app
      ttl: PT15M
      secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
